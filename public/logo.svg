<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4A0" />
      <stop offset="100%" stop-color="#0DB9D0" />
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBF5FC" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0DB9D0" stop-opacity="0.05" />
    </linearGradient>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="#03060E" />
  
  <circle cx="256" cy="256" r="180" stroke="url(#mainGrad)" stroke-width="6" stroke-opacity="0.3" filter="url(#innerGlow)" />
  <circle cx="256" cy="256" r="220" stroke="#0DB9D0" stroke-width="2" stroke-dasharray="12 24" opacity="0.8" />

  <path d="M256 76 L411.88 166 L411.88 346 L256 436 L100.12 346 L100.12 166 Z" fill="url(#glassGrad)" stroke="url(#mainGrad)" stroke-width="8" />

  <path d="M256 76 L411.88 346 L100.12 346 Z" fill="none" stroke="#0DB9D0" stroke-width="6" opacity="0.7" />
  <path d="M100.12 166 L411.88 166 L256 436 Z" fill="none" stroke="#0DB9D0" stroke-width="6" opacity="0.7" />

  <circle cx="256" cy="256" r="64" fill="#03060E" stroke="url(#mainGrad)" stroke-width="10" filter="url(#innerGlow)" />
  <circle cx="256" cy="256" r="36" fill="#00D4A0" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="14" fill="#03060E" />

  <circle cx="256" cy="76" r="14" fill="#EBF5FC" filter="url(#innerGlow)" />
  <circle cx="411.88" cy="166" r="14" fill="#EBF5FC" filter="url(#innerGlow)" />
  <circle cx="411.88" cy="346" r="14" fill="#EBF5FC" filter="url(#innerGlow)" />
  <circle cx="256" cy="436" r="14" fill="#EBF5FC" filter="url(#innerGlow)" />
  <circle cx="100.12" cy="346" r="14" fill="#EBF5FC" filter="url(#innerGlow)" />
  <circle cx="100.12" cy="166" r="14" fill="#EBF5FC" filter="url(#innerGlow)" />
</svg>
